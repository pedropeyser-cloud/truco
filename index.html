<script>
// Este juego se mudó a AZAR. Se conserva todo lo que trae el link (?sala=, ?mesa=, #…) y se borra la copia vieja guardada.
(async () => {
  try { const rs = await navigator.serviceWorker?.getRegistrations?.(); await Promise.all((rs || []).map((r) => r.unregister())); } catch {}
  try { const ks = await caches.keys(); await Promise.all(ks.map((k) => caches.delete(k))); } catch {}
  const resto = location.pathname.replace(/^\/[^/]+\/?/, "");
  location.replace("https://pedropeyser-cloud.github.io/azar/juegos/truco/" + resto + location.search + location.hash);
})();
</script></head>
